@if (form) {
  <form [formGroup]="form">
    <div class="row">
      <div class="col-md-6">
        <div class="row">
          <label for="categoryName" class="col-md-4 col-form-label">Name: </label>
          <div class="col-md-8 position-relative">
            <input
              id="categoryName"
              type="text"
              formControlName="name"
              class="form-control"
              [class.is-invalid]="isFieldInvalid('name')"
            />
            <div class="invalid-tooltip">{{ getErrorMessage('name', 'Name') }}</div>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="row">
          <label for="parentCategory" class="col-md-4 col-form-label">Über-Kategorie: </label>
          <div class="col-md-8">
            <select id="parentCategory" class="form-select" formControlName="parentId">
              <option [value]="null">-- Keine --</option>
              @for (cat of categories(); track cat.id) {
                <option [value]="cat.id">{{ cat.name }}</option>
              }
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2 pt-2">
      <button type="reset" (click)="onCancel()" class="btn btn-danger">Abbrechen</button>
      <button type="submit" (click)="onSubmit()" class="btn btn-success" [disabled]="isSubmitDisabled()">
        Hinzufügen
      </button>
    </div>
  </form>
}
